# The following is the order of the links in the header of the website.
#
# Changing the order here will adjust the order and you can also add additional
# links. Removing a link prevents it from showing in the header, but does not
# prevent it from being included in the site.
#
# NOTE that only one of the CV options should be selected, the first is for the
#      Markdown formatted page while the second is generated using JSON.
#
# Each entry may also carry a `title_zh`, which is shown when the reader picks
# 中文 in the language switcher on the homepage. If it is missing, `title` is
# used for both languages.

main:
  # Quick jumps to the sections of the homepage. The full publication list is
  # still reachable from the hero card and the "All Publications" button.
  - title: "About"
    title_zh: "关于"
    url: /#about-me

  - title: "Publications"
    title_zh: "论文"
    url: /#publications

  - title: "News"
    title_zh: "新闻"
    url: /#news

  - title: "Contact"
    title_zh: "联系"
    url: /#contact

